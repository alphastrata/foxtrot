[package]
name = "triangulate"
version = "0.1.0"
authors = ["Matt Keeter <matt.j.keeter@gmail.com>"]
edition = "2024"

[dependencies]
cdt = { path = "../cdt" }
nurbs = { path = "../nurbs" }
step = { path = "../step" }
log = { workspace = true }
nalgebra-glm = { workspace = true }
nalgebra = { workspace = true, optional = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }

[features]
parallel = ["rayon", "step/parallel", "dep:nalgebra"]

[dev-dependencies]
clap = { workspace = true }
env_logger = { workspace = true }
